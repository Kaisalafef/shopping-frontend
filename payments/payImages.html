<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة إعدادات الدفع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --accent-gold: #f0c14b;
    --accent-gold-hover: #ddb347;
    --dark-navy: #232f3e;
    --dark-navy-soft: #2c3e50;
    --text-gray: #636e72;
    --success: #27ae60;
    --radius-lg: 20px;
    --radius-md: 14px;
}

* { box-sizing: border-box; }

body{
    margin:0;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, var(--dark-navy) 0%, var(--dark-navy-soft) 55%, #3a4d63 100%);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding: 40px 24px;
}

.container{
    background:white;
    width:100%;
    max-width: 800px;
    border-radius: var(--radius-lg);
    padding:40px;
    box-shadow: 0 20px 50px rgba(35, 47, 62, 0.25);
    border-top: 5px solid var(--accent-gold);
}

h1{
    text-align:center;
    margin: 0 0 8px;
    color: var(--dark-navy);
    font-size: 1.5rem;
    font-weight: 800;
}

.page-subtitle {
    text-align: center;
    color: var(--text-gray);
    font-size: 0.9rem;
    margin: 0 0 36px;
}

/* Payment Method Sections */
.payment-section {
    background: #fafbfc;
    border-radius: var(--radius-md);
    padding: 24px;
    margin-bottom: 24px;
    border: 1px solid #e8ecf1;
}

.payment-section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 2px solid #e8ecf1;
}

.payment-section-header i {
    font-size: 1.5rem;
    color: var(--accent-gold);
}

.payment-section-header h2 {
    margin: 0;
    font-size: 1.1rem;
    color: var(--dark-navy);
}

.qr-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

.upload-box{
    border:2px dashed #d8dce1;
    border-radius: var(--radius-md);
    padding:24px 18px;
    text-align:center;
    cursor:pointer;
    transition:0.25s ease;
    position:relative;
    background: white;
}

.upload-box strong {
    display: block;
    color: var(--dark-navy);
    font-size: 1rem;
    margin-bottom: 4px;
}

.upload-box .hint {
    display: block;
    color: var(--text-gray);
    font-size: 0.8rem;
    margin-top: 4px;
}

.upload-box i.upload-icon {
    display: block;
    font-size: 1.8rem;
    color: var(--accent-gold);
    margin-bottom: 10px;
}

.upload-box:hover{
    border-color: var(--accent-gold);
    background:#fffaf0;
}

.upload-box input{
    display:none;
}

.preview{
    margin-top:15px;
}

.preview img{
    width:100%;
    max-width: 150px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

/* حقل عنوان المحفظة */
.wallet-field{
    margin-top: 18px;
    text-align: right;
}

.wallet-field label{
    display:block;
    font-size:0.9rem;
    font-weight:600;
    color: var(--dark-navy);
    margin-bottom:8px;
}

.wallet-field input[type="text"],
.wallet-field select{
    width:100%;
    padding:12px 14px;
    border:2px solid #d8dce1;
    border-radius:10px;
    font-family:'Cairo', sans-serif;
    font-size:0.95rem;
    direction:ltr;
    text-align:left;
    transition: 0.2s;
}

.wallet-field input[type="text"]:focus,
.wallet-field select:focus{
    outline:none;
    border-color: var(--accent-gold);
}

.wallet-field small {
    display: block;
    margin-top: 6px;
    color: var(--text-gray);
    font-size: 0.8rem;
}

.network-field {
    margin-top: 15px;
}

.save-btn{
    margin-top:36px;
    width:100%;
    padding:16px;
    border:none;
    border-radius: var(--radius-md);
    background: var(--accent-gold);
    color: var(--dark-navy);
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size:1rem;
    cursor:pointer;
    transition:0.25s ease;
}

.save-btn:hover{
    background: var(--accent-gold-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(240, 193, 75, 0.35);
}

.success{
    text-align:center;
    color: var(--success);
    margin-top:20px;
    display:none;
    font-weight: 600;
    padding: 12px;
    background: #e8f5e9;
    border-radius: 8px;
}

@media (max-width: 640px) {
    body { padding: 16px; }
    .container { padding: 28px 20px; border-radius: 18px; }
    .qr-grid { grid-template-columns: 1fr; gap: 18px; }
    h1 { font-size: 1.25rem; }
    .page-subtitle { margin-bottom: 26px; }
    .upload-box { padding: 20px 14px; }
    .preview img { max-width: 130px; height: 130px; }
    .payment-section { padding: 20px 16px; }
}

@media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="container">
    <h1>إدارة إعدادات الدفع</h1>
    <p class="page-subtitle">إدارة صور QR وعناوين المحافظ لطرق الدفع اليدوية</p>

    <!-- قسم شام كاش -->
    <div class="payment-section">
        <div class="payment-section-header">
            <i class="fa-solid fa-wallet"></i>
            <h2>إعدادات شام كاش</h2>
        </div>
        
        <div class="qr-grid">
            <div class="upload-box" id="shamcashBox">
                <label style="cursor:pointer; display:block;">
                    <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                    <strong>QR شام كاش</strong>
                    <span class="hint">اضغط لاختيار صورة</span>
                    <input type="file" id="shamcashInput" accept="image/*">
                </label>
                <div class="preview" id="shamPreview"></div>
            </div>

            <div class="wallet-field">
                <label for="shamcashWallet">عنوان محفظة شام كاش (رقم الهاتف أو المعرّف)</label>
                <input type="text" id="shamcashWallet" placeholder="مثال: 0989xxxxxx">
                <small>هذا ما سيراه العميل عند الدفع</small>
            </div>
            
            <div class="wallet-field">
                <label for="shamcashLabel">التسمية المعروضة للعميل</label>
                <input type="text" id="shamcashLabel" placeholder="مثال: رقم المحفظة / معرف التاجر" value="رقم المحفظة/الهاتف">
            </div>
        </div>
    </div>

    <!-- قسم USDT -->
    <div class="payment-section">
        <div class="payment-section-header">
            <i class="fa-solid fa-coins"></i>
            <h2>إعدادات USDT</h2>
        </div>
        
        <div class="qr-grid">
            <div class="upload-box">
                <label style="cursor:pointer; display:block;">
                    <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                    <strong>QR USDT</strong>
                    <span class="hint">اضغط لاختيار صورة</span>
                    <input type="file" id="usdtInput" accept="image/*">
                </label>
                <div class="preview" id="usdtPreview"></div>
            </div>

            <div class="wallet-field">
                <label for="usdtWallet">عنوان محفظة USDT</label>
                <input type="text" id="usdtWallet" placeholder="مثال: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t">
                <small>عنوان المحفظة على الشبكة المحددة أدناه</small>
            </div>
            
            <div class="wallet-field">
                <label for="usdtLabel">التسمية المعروضة للعميل</label>
                <input type="text" id="usdtLabel" placeholder="مثال: عنوان المحفظة (TRC20)" value="عنوان المحفظة">
            </div>
            
            <div class="wallet-field network-field">
                <label for="usdtNetwork">الشبكة (Network)</label>
                <select id="usdtNetwork">
                    <option value="TRC20">TRC20 (Tron) - رسوم منخفضة</option>
                    <option value="ERC20">ERC20 (Ethereum)</option>
                    <option value="BEP20">BEP20 (BSC)</option>
                </select>
            </div>
        </div>
    </div>

    <button class="save-btn" onclick="saveAllSettings()">حفظ جميع الإعدادات</button>
    <div class="success" id="successMsg">تم حفظ البيانات بنجاح ✔</div>
</div>

<script>
const API_URL = "https://api.tasswek.com/api";

const shamInput = document.getElementById("shamcashInput");
const usdtInput = document.getElementById("usdtInput");
const shamcashWalletInput = document.getElementById("shamcashWallet");
const shamcashLabelInput = document.getElementById("shamcashLabel");
const usdtWalletInput = document.getElementById("usdtWallet");
const usdtLabelInput = document.getElementById("usdtLabel");
const usdtNetworkInput = document.getElementById("usdtNetwork");

const shamPreview = document.getElementById("shamPreview");
const usdtPreview = document.getElementById("usdtPreview");
const successMsg = document.getElementById("successMsg");

function previewImage(input, previewContainer){
    const file = input.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(e){
        previewContainer.innerHTML = `<img src="${e.target.result}">`;
    }
    reader.readAsDataURL(file);
}

shamInput.addEventListener("change", ()=> previewImage(shamInput, shamPreview));
usdtInput.addEventListener("change", ()=> previewImage(usdtInput, usdtPreview));

// تحميل الإعدادات الحالية عند فتح الصفحة
document.addEventListener("DOMContentLoaded", loadCurrentSettings);

async function loadCurrentSettings() {
    const token = localStorage.getItem("token");
    if (!token) return;

    try {
        const res = await fetch(`${API_URL}/payment-settings`, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (data.shamcash) {
            shamcashWalletInput.value = data.shamcash.wallet_address || '';
            shamcashLabelInput.value = data.shamcash.wallet_label || 'رقم المحفظة/الهاتف';
            if (data.shamcash.qr_url) {
                shamPreview.innerHTML = `<img src="${data.shamcash.qr_url}">`;
            }
        }
        
        if (data.usdt) {
            usdtWalletInput.value = data.usdt.wallet_address || '';
            usdtLabelInput.value = data.usdt.wallet_label || 'عنوان المحفظة';
            usdtNetworkInput.value = data.usdt.network || 'TRC20';
            if (data.usdt.qr_url) {
                usdtPreview.innerHTML = `<img src="${data.usdt.qr_url}">`;
            }
        }
    } catch (error) {
        console.error("فشل تحميل الإعدادات", error);
    }
}

async function saveAllSettings(){
    const token = localStorage.getItem("token");
    if(!token){
        alert("غير مصرح - يرجى تسجيل الدخول كأدمن");
        return;
    }

    const shamcashWallet = shamcashWalletInput.value.trim();
    const shamcashLabel = shamcashLabelInput.value.trim();
    const usdtWallet = usdtWalletInput.value.trim();
    const usdtLabel = usdtLabelInput.value.trim();
    const usdtNetwork = usdtNetworkInput.value;

    // التحقق من وجود بيانات على الأقل
    if(!shamcashWallet && !shamInput.files[0] && !usdtWallet && !usdtInput.files[0]){
        alert("الرجاء إدخال بيانات على الأقل لإحدى طرق الدفع");
        return;
    }

    try {
        let hasChanges = false;

        // 1) حفظ إعدادات شام كاش
        if (shamcashWallet || shamInput.files[0] || shamcashLabel) {
            const shamcashData = new FormData();
            if (shamcashWallet) shamcashData.append("wallet_address", shamcashWallet);
            if (shamcashLabel) shamcashData.append("wallet_label", shamcashLabel);
            if (shamInput.files[0]) shamcashData.append("qr_image", shamInput.files[0]);

            const shamRes = await fetch(`${API_URL}/admin/payment-settings/shamcash`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${token}` },
                body: shamcashData
            });

            const shamResult = await shamRes.json();
            if(!shamRes.ok){
                throw new Error(shamResult.message || "فشل حفظ بيانات شام كاش");
            }
            hasChanges = true;
        }

        // 2) حفظ إعدادات USDT
        if (usdtWallet || usdtInput.files[0] || usdtLabel || usdtNetwork) {
            const usdtData = new FormData();
            if (usdtWallet) usdtData.append("wallet_address", usdtWallet);
            if (usdtLabel) usdtData.append("wallet_label", usdtLabel);
            if (usdtNetwork) usdtData.append("network", usdtNetwork);
            if (usdtInput.files[0]) usdtData.append("qr_image", usdtInput.files[0]);

            const usdtRes = await fetch(`${API_URL}/admin/payment-settings/usdt`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${token}` },
                body: usdtData
            });

            const usdtResult = await usdtRes.json();
            if(!usdtRes.ok){
                throw new Error(usdtResult.message || "فشل حفظ بيانات USDT");
            }
            hasChanges = true;
        }

        if (hasChanges) {
            successMsg.style.display = "block";
            alert("تم حفظ جميع الإعدادات بنجاح ✔");
            // إعادة تحميل للتأكد
            loadCurrentSettings();
        } else {
            alert("لا توجد تغييرات للحفظ");
        }

    }catch(error){
        console.error(error);
        alert(error.message || "حدث خطأ أثناء الحفظ");
    }
}
</script>

</body>
</html>
