<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع أكواد QR</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --accent-gold: #f0c14b;
    --accent-gold-hover: #ddb347;
    --dark-navy: #232f3e;
    --dark-navy-soft: #2c3e50;
    --text-gray: #636e72;
    --success: #27ae60;
    --radius-lg: 20px;
    --radius-md: 14px;
}

* { box-sizing: border-box; }

body{
    margin:0;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, var(--dark-navy) 0%, var(--dark-navy-soft) 55%, #3a4d63 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding: 24px;
}

.container{
    background:white;
    width:100%;
    max-width: 760px;
    border-radius: var(--radius-lg);
    padding:40px;
    box-shadow: 0 20px 50px rgba(35, 47, 62, 0.25);
    border-top: 5px solid var(--accent-gold);
}

h1{
    text-align:center;
    margin: 0 0 8px;
    color: var(--dark-navy);
    font-size: 1.5rem;
    font-weight: 800;
}

.page-subtitle {
    text-align: center;
    color: var(--text-gray);
    font-size: 0.9rem;
    margin: 0 0 36px;
}

.qr-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

.upload-box{
    border:2px dashed #d8dce1;
    border-radius: var(--radius-md);
    padding:24px 18px;
    text-align:center;
    cursor:pointer;
    transition:0.25s ease;
    position:relative;
    background: #fafbfc;
}

.upload-box strong {
    display: block;
    color: var(--dark-navy);
    font-size: 1rem;
    margin-bottom: 4px;
}

.upload-box .hint {
    display: block;
    color: var(--text-gray);
    font-size: 0.8rem;
    margin-top: 4px;
}

.upload-box i.upload-icon {
    display: block;
    font-size: 1.8rem;
    color: var(--accent-gold);
    margin-bottom: 10px;
}

.upload-box:hover{
    border-color: var(--accent-gold);
    background:#fffaf0;
}

.upload-box input{
    display:none;
}

.preview{
    margin-top:15px;
}

.preview img{
    width:100%;
    max-width: 150px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.save-btn{
    margin-top:36px;
    width:100%;
    padding:16px;
    border:none;
    border-radius: var(--radius-md);
    background: var(--accent-gold);
    color: var(--dark-navy);
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size:1rem;
    cursor:pointer;
    transition:0.25s ease;
}

.save-btn:hover{
    background: var(--accent-gold-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(240, 193, 75, 0.35);
}

.success{
    text-align:center;
    color: var(--success);
    margin-top:20px;
    display:none;
    font-weight: 600;
}

@media (max-width: 640px) {
    body {
        padding: 16px;
    }

    .container {
        padding: 28px 20px;
        border-radius: 18px;
    }

    .qr-grid {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    h1 {
        font-size: 1.25rem;
    }

    .page-subtitle {
        margin-bottom: 26px;
    }

    .upload-box {
        padding: 20px 14px;
    }

    .preview img {
        max-width: 130px;
        height: 130px;
    }
}

@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>رفع صور QR لطرق الدفع</h1>
    <p class="page-subtitle">هذه الصور ستظهر للعملاء عند اختيار الدفع الإلكتروني</p>

    <div class="qr-grid">

        <label class="upload-box">
            <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
            <strong>QR شام كاش</strong>
            <span class="hint">اضغط لاختيار صورة</span>
            <input type="file" id="shamcashInput" accept="image/*">
            <div class="preview" id="shamPreview"></div>
        </label>

        <label class="upload-box">
            <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
            <strong>QR USDT</strong>
            <span class="hint">اضغط لاختيار صورة</span>
            <input type="file" id="usdtInput" accept="image/*">
            <div class="preview" id="usdtPreview"></div>
        </label>

    </div>

    <button class="save-btn" onclick="saveQR()">حفظ الصور</button>
    <div class="success" id="successMsg">تم حفظ الصور بنجاح ✔</div>
</div>

<script>
const shamInput = document.getElementById("shamcashInput");
const usdtInput = document.getElementById("usdtInput");

const shamPreview = document.getElementById("shamPreview");
const usdtPreview = document.getElementById("usdtPreview");

function previewImage(input, previewContainer){
    const file = input.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(e){
        previewContainer.innerHTML = `<img src="${e.target.result}">`;
    }
    reader.readAsDataURL(file);
}

shamInput.addEventListener("change", ()=> previewImage(shamInput, shamPreview));
usdtInput.addEventListener("change", ()=> previewImage(usdtInput, usdtPreview));

async function saveQR(){

    const token = localStorage.getItem("token");

    if(!token){
        alert("غير مصرح");
        return;
    }

    const formData = new FormData();

    if(shamInput.files[0]){
        formData.append("shamcash_qr", shamInput.files[0]);
    }

    if(usdtInput.files[0]){
        formData.append("usdt_qr", usdtInput.files[0]);
    }

    try{

        const response = await fetch("https://api.tasswek.com/api/upload-qr",{
            method: "POST",
            headers:{
                "Authorization": `Bearer ${token}`
            },
            body: formData
        });

        const result = await response.json();

        if(!response.ok){
            throw new Error(result.message);
        }

        alert("تم رفع الصور بنجاح ✔");

    }catch(error){
        console.error(error);
        alert("حدث خطأ");
    }
}
</script>

</body>
</html>
