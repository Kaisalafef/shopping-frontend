<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع أكواد QR وروابط المحافظ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --accent-gold: #f0c14b;
    --accent-gold-hover: #ddb347;
    --dark-navy: #232f3e;
    --dark-navy-soft: #2c3e50;
    --text-gray: #636e72;
    --success: #27ae60;
    --radius-lg: 20px;
    --radius-md: 14px;
}

* { box-sizing: border-box; }

body{
    margin:0;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, var(--dark-navy) 0%, var(--dark-navy-soft) 55%, #3a4d63 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding: 24px;
}

.container{
    background:white;
    width:100%;
    max-width: 760px;
    border-radius: var(--radius-lg);
    padding:40px;
    box-shadow: 0 20px 50px rgba(35, 47, 62, 0.25);
    border-top: 5px solid var(--accent-gold);
}

h1{
    text-align:center;
    margin: 0 0 8px;
    color: var(--dark-navy);
    font-size: 1.5rem;
    font-weight: 800;
}

.page-subtitle {
    text-align: center;
    color: var(--text-gray);
    font-size: 0.9rem;
    margin: 0 0 36px;
}

.qr-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

.upload-box{
    border:2px dashed #d8dce1;
    border-radius: var(--radius-md);
    padding:24px 18px;
    text-align:center;
    cursor:pointer;
    transition:0.25s ease;
    position:relative;
    background: #fafbfc;
}

.upload-box strong {
    display: block;
    color: var(--dark-navy);
    font-size: 1rem;
    margin-bottom: 4px;
}

.upload-box .hint {
    display: block;
    color: var(--text-gray);
    font-size: 0.8rem;
    margin-top: 4px;
}

.upload-box i.upload-icon {
    display: block;
    font-size: 1.8rem;
    color: var(--accent-gold);
    margin-bottom: 10px;
}

.upload-box:hover{
    border-color: var(--accent-gold);
    background:#fffaf0;
}

.upload-box input{
    display:none;
}

.preview{
    margin-top:15px;
}

.preview img{
    width:100%;
    max-width: 150px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

/* حقل رابط/عنوان المحفظة (يظهر فقط تحت شام كاش) */
.wallet-field{
    margin-top: 18px;
    text-align: right;
    cursor: default;
}

.wallet-field label{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    color: var(--dark-navy);
    margin-bottom:6px;
}

.wallet-field input[type="text"]{
    width:100%;
    padding:11px 14px;
    border:2px solid #d8dce1;
    border-radius:10px;
    font-family:'Cairo', sans-serif;
    font-size:0.9rem;
    direction:ltr;
    text-align:left;
}

.wallet-field input[type="text"]:focus{
    outline:none;
    border-color: var(--accent-gold);
}

.save-btn{
    margin-top:36px;
    width:100%;
    padding:16px;
    border:none;
    border-radius: var(--radius-md);
    background: var(--accent-gold);
    color: var(--dark-navy);
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size:1rem;
    cursor:pointer;
    transition:0.25s ease;
}

.save-btn:hover{
    background: var(--accent-gold-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(240, 193, 75, 0.35);
}

.success{
    text-align:center;
    color: var(--success);
    margin-top:20px;
    display:none;
    font-weight: 600;
}

@media (max-width: 640px) {
    body {
        padding: 16px;
    }

    .container {
        padding: 28px 20px;
        border-radius: 18px;
    }

    .qr-grid {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    h1 {
        font-size: 1.25rem;
    }

    .page-subtitle {
        margin-bottom: 26px;
    }

    .upload-box {
        padding: 20px 14px;
    }

    .preview img {
        max-width: 130px;
        height: 130px;
    }
}

@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>رفع صور QR وروابط المحافظ</h1>
    <p class="page-subtitle">هذه البيانات ستظهر للعملاء عند اختيار الدفع الإلكتروني</p>

    <div class="qr-grid">

        <!-- شام كاش: صورة QR + عنوان/رابط المحفظة -->
        <div class="upload-box" id="shamcashBox">
            <label style="cursor:pointer; display:block;">
                <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                <strong>QR شام كاش</strong>
                <span class="hint">اضغط لاختيار صورة</span>
                <input type="file" id="shamcashInput" accept="image/*">
            </label>
            <div class="preview" id="shamPreview"></div>

            <!-- حقل عنوان/رابط المحفظة الخاص بشام كاش -->
            
        </div>
<div class="wallet-field" onclick="event.stopPropagation()">
                <label for="shamcashWallet">عنوان محفظة شام كاش (رقم الهاتف أو المعرّف)</label>
                <input type="text" id="shamcashWallet" placeholder="مثال: 0989xxxxxx">
            </div>
        <!-- USDT: صورة QR فقط حالياً (رابط المحفظة سيُضاف لاحقاً) -->
        <label class="upload-box">
            <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
            <strong>QR USDT</strong>
            <span class="hint">اضغط لاختيار صورة</span>
            <input type="file" id="usdtInput" accept="image/*">
            <div class="preview" id="usdtPreview"></div>
        </label>

    </div>

    <button class="save-btn" onclick="saveQR()">حفظ التغييرات</button>
    <div class="success" id="successMsg">تم حفظ البيانات بنجاح ✔</div>
</div>

<script>
const API_URL = "https://api.tasswek.com/api";

const shamInput = document.getElementById("shamcashInput");
const usdtInput = document.getElementById("usdtInput");
const shamcashWalletInput = document.getElementById("shamcashWallet");

const shamPreview = document.getElementById("shamPreview");
const usdtPreview = document.getElementById("usdtPreview");
const successMsg = document.getElementById("successMsg");

function previewImage(input, previewContainer){
    const file = input.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(e){
        previewContainer.innerHTML = `<img src="${e.target.result}">`;
    }
    reader.readAsDataURL(file);
}

shamInput.addEventListener("change", ()=> previewImage(shamInput, shamPreview));
usdtInput.addEventListener("change", ()=> previewImage(usdtInput, usdtPreview));

async function saveQR(){

    const token = localStorage.getItem("token");

    if(!token){
        alert("غير مصرح");
        return;
    }

    const wallet = shamcashWalletInput.value.trim();

    if(!wallet && !shamInput.files[0] && !usdtInput.files[0]){
        alert("الرجاء إدخال عنوان محفظة شام كاش أو اختيار صورة على الأقل");
        return;
    }

    try{
        // 1) حفظ بيانات شام كاش (صورة + عنوان محفظة) عبر النقطة الجديدة
        if(wallet || shamInput.files[0]){
            if(!wallet){
                alert("عنوان محفظة شام كاش مطلوب لحفظ التغييرات");
                return;
            }

            const shamcashData = new FormData();
shamcashData.append("wallet_address", wallet);
if (shamInput.files[0]) {
    shamcashData.append("qr_image", shamInput.files[0]);
}

const shamRes = await fetch(`${API_URL}/admin/payment-settings/shamcash`, {
    method: "POST",
    headers: { "Authorization": `Bearer ${token}` }, // no Content-Type — browser sets multipart boundary
    body: shamcashData
});

            const shamResult = await shamRes.json();
            if(!shamRes.ok){
                throw new Error(shamResult.message || "فشل حفظ بيانات شام كاش");
            }
        }

        // 2) حفظ صورة USDT (بدون رابط محفظة حالياً) عبر النقطة القديمة
        if(usdtInput.files[0]){
            const usdtData = new FormData();
            usdtData.append("usdt_qr", usdtInput.files[0]);

            const usdtRes = await fetch(`${API_URL}/upload-qr`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`
                },
                body: usdtData
            });

            const usdtResult = await usdtRes.json();
            if(!usdtRes.ok){
                throw new Error(usdtResult.message || "فشل رفع صورة USDT");
            }
        }

        successMsg.style.display = "block";
        alert("تم حفظ البيانات بنجاح ✔");

    }catch(error){
        console.error(error);
        alert(error.message || "حدث خطأ أثناء الحفظ");
    }
}
</script>

</body>
</html>
