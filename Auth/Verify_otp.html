<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta name="color-scheme" content="light only" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>تفعيل الحساب - مودرن ماركت</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .otp-inputs {
            direction: ltr;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0 20px;
        }

        .otp-inputs input {
            width: 45px;
            height: 55px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            padding: 0;
        }

        .phone-display {
            text-align: center;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 20px;
            direction: ltr;
        }

        .resend-wrap {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .resend-link {
            color: var(--primary-color);
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .resend-link.disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="background-blob"></div>
    <div class="container">
        <img class="logo" src="/images/looogo.png" alt="Logo">
        <h2>تفعيل الحساب</h2>
        <p class="subtitle">أدخل رمز التحقق المرسل إلى رقم هاتفك</p>
        <p class="phone-display" id="phoneDisplay"></p>

        <form id="otpForm">
            <div class="otp-inputs" id="otpInputs">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="0" autocomplete="one-time-code">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="1">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="2">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="3">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="4">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" data-index="5">
            </div>

            <div id="otpError" class="general-error"></div>

            <button type="submit" class="btn-primary">تفعيل الحساب</button>
        </form>

        <p class="resend-wrap">
            لم يصلك الرمز؟
            <a href="#" id="resendLink" class="resend-link">إعادة إرسال الرمز</a>
            <span id="resendTimer"></span>
        </p>
    </div>

    <script src="otp.js"></script>
</body>

</html>
